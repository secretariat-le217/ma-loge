<script>
  // La page relais : elle ne contient AUCUNE donnée, seulement l'adresse de la plateforme.
  // Seul le paramètre du lien de groupe de « Qui vient ? » est transmis (?q=tenue-AAAA-MM-JJ) ;
  // tout autre paramètre (jeton de session, lien personnel) est volontairement abandonné.
  (function () {
    var cible = 'https://script.google.com/macros/s/AKfycbz6SKC0BTCb5pZr6a0439b2yaOUD5ZuGRRHFN78zzFeJctvieLSxGJ2RGhji8vNKypjCQ/exec';
    var q = null;
    try { q = new URLSearchParams(window.location.search).get('q'); } catch (e) {}
    if (q && /^(tenue-)?\d{4}-\d{2}-\d{2}$/.test(q)) cible += '?q=' + encodeURIComponent(q);
    window.location.replace(cible);
  })();
</script>
